<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
        }

        .section {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #38bdf8;
            color: black;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #334155;
        }

        th {
            text-align: left;
            background: #0f172a;
        }
    </style>
    <title>Inventory System</title>

</head>

<body>

    <div class="container">

        <h1>♻ Inventory Dashboard</h1>

        <div class="section">
            <h2>Materials</h2>

            <button onclick="loadMaterials()">🔄 Refresh</button>
        </div>

        <!-- CARDS -->
        <div class="cards">
            <div class="card">
                <h3>Total Materials</h3>
                <p id="totalMaterials">0</p>
            </div>

            <div class="card">
                <h3>Total Movements</h3>
                <p id="totalMovements">0</p>
            </div>
        </div>

        <!-- CREATE MATERIAL -->
        <div class="section">
            <h2>Create Material</h2>

            <input id="name" placeholder="Name">
            <input id="type" placeholder="Type">
            <input id="quantity" type="number" placeholder="Quantity">
            <input id="unit" placeholder="Unit">

            <button onclick="createMaterial()">Create</button>
        </div>

        <div class="section">
            <h2>Filters</h2>

            <input placeholder="Search name..." oninput="filterByName(this.value)">

            <button onclick="sortByName()">Sort by Name</button>
            <button onclick="sortByType()">Sort by Type</button>
            <button onclick="sortByQuantity()">Sort by Quantity</button>

            <button onclick="loadMaterials()">Reset</button>
        </div>

        <!-- MATERIALS TABLE -->
        <div class="section">
            <h2>Materials</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Quantity</th>
                        <th>Unit</th>
                    </tr>
                </thead>
                <tbody id="materialsTable"></tbody>
            </table>
        </div>

        <!-- MOVEMENTS -->
        <div class="section">
            <h2>Movements</h2>

            <button onclick="loadMovements()">All</button>
            <button onclick="loadMovements('IN')">IN</button>
            <button onclick="loadMovements('OUT')">OUT</button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Quantity</th>
                        <th>Description</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="movementsTable"></tbody>
            </table>
        </div>

    </div>
    <script src="/frontend/app.js"></script>
</body>

</html>
